[project]
name = "http-retry-after-parser"
version = "0.1.0"
description = "Parses HTTP Retry-After headers into second-based delays from either date or seconds format."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
